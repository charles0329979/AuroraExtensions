name: Daily repository maintenance audit

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run fail-closed maintenance gate
        shell: pwsh
        run: ./scripts/maintain-repo.ps1 -VerifyOnly

      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-maintenance-report
          path: reports/
